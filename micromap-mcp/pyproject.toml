[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micromap-mcp"
version = "0.1.0"
description = "MCP server exposing MicroMap KG queries and MapForge ingestion to Nexus agents."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "neo4j>=5.15",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

# Explicit package discovery — mirrors micromap-mapforge. Without this, newer
# setuptools flat-layout auto-discovery errors on the sibling top-level `connect/`
# dir ("Multiple top-level packages discovered"), which breaks the Docker build.
[tool.setuptools.packages.find]
include = ["micromap_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
