# Conda alternative install path for MapForge.
#
# Mirrors the dependency pins from `pyproject.toml`. Conda is not the
# canonical install path (pip / pyproject is); this file exists for users
# whose environments are conda-managed (academic clusters, mixed-Python/
# R workflows).
#
# Create the environment:
#   conda env create -f environment.yml
#   conda activate mapforge
#   pip install -e .              # editable install for the package itself
#
# Or, for a non-editable install:
#   pip install .                  # from the activated env
#
# When `pyproject.toml` deps change, update this file in the same commit.

name: mapforge
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11,<3.13
  - pip
  # Runtime deps — match pyproject.toml [project.dependencies]
  - pyyaml>=6.0.1
  - jsonschema>=4.21.0
  - click>=8.1.7
  - pyarrow>=15.0.0
  - rapidfuzz>=3.6.0
  - httpx>=0.27.0
  # Dev deps — match pyproject.toml [project.optional-dependencies].dev
  - pytest>=8.0.0
  # Pinned-via-pip-only (no conda-forge package or version we want isn't there)
  - pip:
      - anthropic>=0.40.0
      - neo4j>=5.15,<7
      - biocypher>=0.15.1
      - pytest-snapshot>=0.9.0
      - testcontainers[neo4j]>=4.0.0
      - respx>=0.21.0
