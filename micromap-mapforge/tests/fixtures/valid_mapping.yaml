source:
  name: "partner_gut_study_2026"
  format: tsv
  path: "study.tsv"
entities:
  - label: Taxon
    match_on: ncbi_tax_id
    columns:
      ncbi_tax_id: tax_id
      scientific_name: organism
    confidence: EXTRACTED
  - label: Disease
    match_on: name_normalized
    normalizer: normalize_disease_name
    columns:
      name: condition
    confidence: EXTRACTED
relationships:
  - type: ASSOCIATED_WITH_DISEASE
    from: "Taxon(ncbi_tax_id=row.tax_id)"
    to:   "Disease(name_normalized=normalize(row.condition))"
    properties:
      effect_size: log2fc
      p_value: pvalue
      evidence_level: { constant: computational }
    confidence: EXTRACTED
