# Curated catalog of open-source biomedical knowledge graphs (C6, #76).
#
# The MapForge-unique value over the BioCypher adapter ecosystem: pick a KG to
# bootstrap from with its license posture, adapter availability, and schema
# preview visible up front.
#
# commercial_use: allowed | restricted | prohibited | unknown
# adapter_status: upstream (a BioCypher adapter exists) | contributed (we
#                 contributed it) | needs_contribution (no adapter yet, #76 C9)
#                 | unknown
version: "0.1.0"

# License + commercial_use below are BEST-EFFORT as of each entry's
# last_validated date. They are NOT legal advice and several sources aggregate
# resources with mixed terms. Re-verify against the source's current license
# before any commercial use; this is the data C6.1 (license-aware import
# enforcement) will gate on.
_caveat: >-
  License and commercial-use fields are best-effort as of last_validated and are
  not legal advice; verify each source's current terms before commercial use.

sources:
  - id: reactome
    name: Reactome
    homepage: https://reactome.org
    description: Manually curated, peer-reviewed human pathway database.
    license: CC-BY-4.0
    commercial_use: allowed
    license_notes: Attribution required.
    adapter_status: needs_contribution
    adapter_location: ""
    notes: No standalone biocypher/reactome adapter; currently reachable via pypath/OmniPath aggregation (#76 C9 candidate).
    biolink_categories: [Pathway, Gene, Protein, SmallMolecule, BiologicalProcess]
    recommended_for: [pathway-enrichment, mechanism-of-action]
    est_size: "~2.6k pathways, ~11k reactions (human)"
    last_validated: "2026-06-12"

  - id: open-targets
    name: Open Targets Platform
    homepage: https://platform.opentargets.org
    description: Target-disease associations integrating genetics, omics, and literature evidence.
    license: CC0-1.0
    commercial_use: allowed
    license_notes: Public-domain dedication; no attribution required (courtesy attribution appreciated).
    adapter_status: native
    adapter_location: "micromap_mapforge/integration/biocypher/adapters/open_targets.py:OpenTargetsAdapter"
    notes: >
      The upstream biocypher/open-targets package (github.com/biocypher/open-targets)
      pins requires-python>=3.10,<3.11, which cannot coexist with this project's
      >=3.11 — so this is a native adapter reading Open Targets parquet directly
      via pyarrow, not a wrapper around that package. Scope is intentionally
      narrow (#375): Target/Disease/Molecule nodes (-> Gene/Disease/Drug) + a
      target-disease association edge from the small, pre-aggregated
      association_overall_direct dataset — not the upstream package's full
      40+ node / 50+ edge reference graph, and not the much larger raw
      evidence/ dataset. Run via `mapforge import-kg
      micromap_mapforge.integration.biocypher.adapters.open_targets:OpenTargetsAdapter
      --source <dir with target/disease/drug_molecule/association_overall_direct
      subdirs, matching Open Targets release 25.03+'s real FTP layout> --organization-id
      <id> --out <dir>`; lands in its own Fabric constituent (like primekg), not
      merged into micromap. Field names verified against real downloaded files
      (#388, release 25.03) — the directory names themselves had drifted (Open
      Targets renamed every dataset to snake_case/singular in 25.03: targets->target,
      diseases->disease, molecule->drug_molecule, associationByOverallDirect->
      association_overall_direct) but every column this adapter reads is unchanged.
      A future column mismatch still fails loudly (MissingColumnsError) rather
      than silently dropping data.
    biolink_categories: [Gene, Disease, Drug, Pathway, Phenotype]
    recommended_for: [target-identification, drug-repurposing]
    est_size: "~60k targets, ~18k diseases, millions of associations"
    last_validated: "2026-06-12"

  - id: primekg
    name: PrimeKG
    homepage: https://github.com/mims-harvard/PrimeKG
    description: Precision-medicine knowledge graph spanning diseases, drugs, genes, phenotypes.
    license: MIT
    commercial_use: allowed
    license_notes: Code MIT; the released graph is on Harvard Dataverse — verify the dataset's own license terms.
    adapter_status: native
    adapter_location: "micromap_mapforge/integration/biocypher/adapters/primekg.py:PrimeKGAdapter"
    notes: >
      Verified live against real data (2026-09-11, DOI 10.7910/DVN/IXA7BM):
      129,375 nodes / ~4,050,249 edges across nodes.tab + edges.csv. Note:
      818 of the 129,375 nodes are `exposure`-typed and sourced from CTD
      (Comparative Toxicogenomics Database), whose own terms prohibit
      commercial use without permission — the same restricted source PrimeKG
      shares with OptimusKG (see the OptimusKG evaluation, #374). Excluded by
      default via `exclude_node_types`, configurable. PrimeKG's own README
      says it's been superseded by OptimusKG ("a superset... recommended
      instead in almost every case") — OptimusKG was evaluated and rejected
      for now: it bundles multiple confirmed commercially-restricted sources
      (DrugBank, CTD, OnSIDES, likely DisGeNET) with no pre-built safe
      subset, and would need its own license-filtering project before any
      commercial use.
    biolink_categories: [Disease, Drug, Gene, Phenotype, Pathway, BiologicalProcess, AnatomicalEntity]
    recommended_for: [bootstrap-from-scratch, drug-repurposing, rare-disease]
    est_size: "~129k nodes, ~4M edges"
    last_validated: "2026-09-11"

